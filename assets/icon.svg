<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a82ee"/>
      <stop offset="1" stop-color="#1c5bc4"/>
    </linearGradient>
    <linearGradient id="pig" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#d6e6ff"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <!-- a small piggy bank: an original mark -->
  <!-- coin going into the slot -->
  <circle cx="232" cy="128" r="38" fill="#bcd6ff"/>
  <circle cx="232" cy="128" r="24" fill="none" stroke="#2268d8" stroke-width="8"/>
  <!-- tail -->
  <path d="M118 262c-22-4-36 8-32 24 4 14 22 16 28 4 5-10-6-18-14-10" fill="none" stroke="#d6e6ff" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- legs -->
  <rect x="168" y="330" width="52" height="74" rx="22" fill="#c4dbff"/>
  <rect x="292" y="330" width="52" height="74" rx="22" fill="#c4dbff"/>
  <!-- ear -->
  <path d="M302 186l20-52 34 58z" fill="#c4dbff" stroke="#c4dbff" stroke-width="14" stroke-linejoin="round"/>
  <!-- body -->
  <ellipse cx="256" cy="276" rx="142" ry="104" fill="url(#pig)"/>
  <!-- snout -->
  <rect x="366" y="244" width="62" height="64" rx="26" fill="#c4dbff"/>
  <circle cx="388" cy="276" r="7" fill="#2268d8"/>
  <circle cx="408" cy="276" r="7" fill="#2268d8"/>
  <!-- eye -->
  <circle cx="330" cy="240" r="11" fill="#163f86"/>
  <!-- slot -->
  <rect x="196" y="184" width="72" height="14" rx="7" fill="#2268d8"/>
</svg>
