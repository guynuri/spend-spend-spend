name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # The repo is public, so Actions logs are public. deploy.sh prints the setup link on the
      # first deploy; providing BOOTSTRAP_TOKEN as a secret makes GitHub mask it (***) in the log.
      - name: Require BOOTSTRAP_TOKEN secret
        env:
          BOOTSTRAP_TOKEN: ${{ secrets.BOOTSTRAP_TOKEN }}
        run: |
          if [ -z "$BOOTSTRAP_TOKEN" ]; then
            echo "::error::Add a BOOTSTRAP_TOKEN repository secret (any long random string)."
            exit 1
          fi
      - name: Deploy
        run: bash scripts/deploy.sh
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          BOOTSTRAP_TOKEN: ${{ secrets.BOOTSTRAP_TOKEN }}
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
